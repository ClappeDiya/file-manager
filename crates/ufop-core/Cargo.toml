[package]
name = "ufop-core"
version = "0.1.0"
description = "Unified File Operations Platform - shared error type and sync/copy engine"
authors = ["UFOP Team"]
edition = "2021"
rust-version = "1.77"

[features]
default = []
# `impl From<rusqlite::Error> for AppError`, for the desktop app's database.
sqlite = ["dep:rusqlite"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
csv = "1.3"
glob = "0.3"
regex = "1"
rusqlite = { version = "0.35", optional = true }

# Robocopy /A /M /IA /XA /A+ /A- and /COPY:SOU (NTFS attributes, ACLs, owner,
# auditing) — Windows-only APIs.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
