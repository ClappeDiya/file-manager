[package]
name = "ufop-core"
version = "0.1.0"
description = "Unified File Operations Platform - shared error type and sync/copy engine"
authors = ["UFOP Team"]
license-file = "../../LICENSE"
edition = "2021"
rust-version = "1.77"

[features]
default = []
# `impl From<rusqlite::Error> for AppError`, for the desktop app's database.
sqlite = ["dep:rusqlite"]
# Deduplicated, compressed, encrypted versioned backup engine (`backup` module).
backup = ["sqlite", "dep:windows", "dep:aes-gcm", "dep:argon2", "dep:flate2", "dep:rand", "dep:hex", "dep:zip", "dep:base64", "dep:zstd", "dep:chacha20poly1305", "dep:tar", "dep:cron"]
# Fleet agent: client side of the admin console's `/api/agent/*` protocol
# (registration, claiming, heartbeats, commands, policies, reports).
agent = ["dep:reqwest", "dep:tokio", "dep:base64"]
# File gateway agent (`gateway` module): serves local folders through ufop-server.
gateway = ["agent", "reqwest/stream", "tokio/fs", "tokio/io-util", "tokio/rt", "dep:tokio-util"]
# Model Context Protocol file tools (`mcp` module): stdio and HTTP transports use the same handler.
mcp = ["dep:base64", "dep:md-5", "dep:sha1"]
# Text from office documents (docx/xlsx/pptx, OpenDocument, RTF) and PDF for previews and search.
doctext = ["dep:zip", "dep:flate2"]
# Shell completions and man pages from a clap command tree (`cli_gen` module).
cli-gen = ["dep:clap"]
# Named server profiles in the `ufop` CLI's config file (`profiles` module), shared with the desktop app.
profiles = ["dep:toml"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# Backup schedules (cron mode); same parser as the desktop schedulers.
cron = { version = "0.12", optional = true }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
csv = "1.3"
glob = "0.3"
regex = "1"
rusqlite = { version = "0.35", features = ["bundled"], optional = true }
aes-gcm = { version = "0.10", optional = true }
argon2 = { version = "0.5", optional = true }
sha2 = "0.10"
flate2 = { version = "1", optional = true }
rand = { version = "0.8", optional = true }
hex = { version = "0.4", optional = true }
zip = { version = "2", optional = true, default-features = false, features = ["deflate", "bzip2", "zstd"] }
base64 = { version = "0.22", optional = true }
zstd = { version = "0.13", optional = true }
# Restore to TAR / TAR.GZ archives.
tar = { version = "0.4", optional = true, default-features = false }
chacha20poly1305 = { version = "0.10", optional = true }
md-5 = { version = "0.10", optional = true }
sha1 = { version = "0.10", optional = true }
# TLS backends come from the consumer (the desktop app / CLI enable theirs).
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json"] }
tokio = { version = "1", optional = true, features = ["time", "sync", "macros"] }
tokio-util = { version = "0.7", optional = true, features = ["io"] }
clap = { version = "4", optional = true, default-features = false, features = ["std", "help"] }
toml = { version = "0.8", optional = true }

# Backup metadata (xattrs, POSIX ACLs via system.* xattrs), advisory locks,
# I/O priority and free-space checks.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
xattr = "1"

# Robocopy /A /M /IA /XA /A+ /A- and /COPY:SOU (NTFS attributes, ACLs, owner,
# auditing) — Windows-only APIs.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Ioctl",
    "Win32_System_IO",
] }
# VSS snapshots (COM IVssBackupComponents).
windows = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_Storage_Vss", "Win32_System_Com"] }

[dev-dependencies]
tempfile = "3"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
