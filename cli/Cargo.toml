[package]
name = "ufop"
version = "0.1.0"
description = "Unified File Operations Platform - CLI"
authors = ["UFOP Team"]
license-file = "../LICENSE"
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "ufop"
path = "src/main.rs"

[dependencies]
# Same sync/copy engine as the desktop app (Robocopy-compatible `ufop copy`).
ufop-core = { path = "../crates/ufop-core", features = ["backup", "agent", "gateway", "mcp", "cli-gen"] }
clap = { version = "4", features = ["derive", "env", "color"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "native-tls", "stream"] }
tokio-util = { version = "0.7", features = ["io"] }
indicatif = "0.18"
dirs = "6"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
glob = "0.3"
# `ufop verify-release`: minisign signatures and SHA-256 of release files.
minisign-verify = "0.2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
# Local database keys (`--db-key-source keyring`), like the desktop app.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[dev-dependencies]
tempfile = "3"
# Synthetic Photos libraries in tests (same version ufop-core already links).
rusqlite = { version = "0.35", features = ["bundled"] }
# Reading archives written by `restore --archive` in tests (same version ufop-core links).
zip = { version = "2", default-features = false, features = ["deflate"] }
