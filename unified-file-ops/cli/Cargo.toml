[package]
name = "ufop"
version = "0.1.0"
description = "Unified File Operations Platform - CLI"
authors = ["UFOP Team"]
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "ufop"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env", "color"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "native-tls"] }
indicatif = "0.17"
console = "0.15"
dialoguer = "0.11"
dirs = "6"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
colored = "3"
tabled = "0.17"
regex = "1"
