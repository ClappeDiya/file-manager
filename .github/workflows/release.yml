name: Release Build & Auto-Update

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Determine release channel from tag or manual input
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine channel
        id: channel
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "channel=$INPUT_CHANNEL" >> "$GITHUB_OUTPUT"
          elif [[ "$REF_NAME" == *"-beta"* ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION:-0.1.0}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # macOS builds: .dmg installer, universal binary (x86_64 + aarch64)
  # ---------------------------------------------------------------------------
  build-macos:
    needs: prepare
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-action/setup@v1
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Import code-signing certificates
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm certificate.p12

      - name: Build Tauri app (macOS)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Unified File Ops v__VERSION__'
          releaseBody: |
            See CHANGELOG.md for details.
          releaseDraft: true
          prerelease: ${{ needs.prepare.outputs.channel == 'beta' }}
          args: --target ${{ matrix.target }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig

  # ---------------------------------------------------------------------------
  # Windows builds: .msi (WiX) and .exe (NSIS) installers
  # ---------------------------------------------------------------------------
  build-windows:
    needs: prepare
    environment: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-action/setup@v1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Import code-signing certificate (Windows)
        if: env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [IO.File]::WriteAllBytes("certificate.pfx", $certBytes)
          Import-PfxCertificate -FilePath certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
          Remove-Item certificate.pfx

      - name: Build Tauri app (Windows)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Unified File Ops v__VERSION__'
          releaseBody: |
            See CHANGELOG.md for details.
          releaseDraft: true
          prerelease: ${{ needs.prepare.outputs.channel == 'beta' }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x86_64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi.sig

  # ---------------------------------------------------------------------------
  # Linux builds: .deb, .rpm, .AppImage
  # ---------------------------------------------------------------------------
  build-linux:
    needs: prepare
    environment: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Install Rust toolchain
        uses: dtolnay/rust-action/setup@v1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (Linux)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Unified File Ops v__VERSION__'
          releaseBody: |
            See CHANGELOG.md for details.
          releaseDraft: true
          prerelease: ${{ needs.prepare.outputs.channel == 'beta' }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-x86_64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig

  # ---------------------------------------------------------------------------
  # Publish update manifest (latest.json) for Tauri updater
  # ---------------------------------------------------------------------------
  publish-update:
    needs: [prepare, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Generate update manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          REPO: ${{ github.repository }}
        run: |
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          NOTES="Release ${VERSION} (${CHANNEL} channel)"

          # Helper: read signature file content
          read_sig() {
            if [ -f "$1" ]; then cat "$1"; else echo ""; fi
          }

          # Collect signatures
          MACOS_AARCH64_SIG=$(read_sig artifacts/macos-aarch64-apple-darwin/*.app.tar.gz.sig 2>/dev/null || echo "")
          MACOS_X86_SIG=$(read_sig artifacts/macos-x86_64-apple-darwin/*.app.tar.gz.sig 2>/dev/null || echo "")
          WINDOWS_NSIS_SIG=$(read_sig artifacts/windows-x86_64/*.exe.sig 2>/dev/null || echo "")
          LINUX_SIG=$(read_sig artifacts/linux-x86_64/*.AppImage.tar.gz.sig 2>/dev/null || echo "")

          REPO_URL="https://github.com/${REPO}/releases/download/v${VERSION}"

          cat > latest.json << MANIFEST
          {
            "version": "${VERSION}",
            "notes": "${NOTES}",
            "pub_date": "${DATE}",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${MACOS_AARCH64_SIG}",
                "url": "${REPO_URL}/Unified.File.Operations.Platform_${VERSION}_aarch64.app.tar.gz"
              },
              "darwin-x86_64": {
                "signature": "${MACOS_X86_SIG}",
                "url": "${REPO_URL}/Unified.File.Operations.Platform_${VERSION}_x64.app.tar.gz"
              },
              "windows-x86_64": {
                "signature": "${WINDOWS_NSIS_SIG}",
                "url": "${REPO_URL}/Unified.File.Operations.Platform_${VERSION}_x64-setup.exe"
              },
              "linux-x86_64": {
                "signature": "${LINUX_SIG}",
                "url": "${REPO_URL}/Unified.File.Operations.Platform_${VERSION}_amd64.AppImage.tar.gz"
              }
            }
          }
          MANIFEST

      - name: Upload update manifest to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release upload "v${VERSION}" latest.json --clobber

  # ---------------------------------------------------------------------------
  # Homebrew cask update (macOS)
  # ---------------------------------------------------------------------------
  # Bumps the cask in ufop/homebrew-tap with the new version + SHA256 of the
  # universal .dmg. Runs only on stable releases; opens (or fast-forwards) a
  # branch on the tap repo and creates a PR. Requires HOMEBREW_TAP_TOKEN with
  # `contents: write` + `pull_requests: write` on ufop/homebrew-tap.
  update-homebrew:
    needs: [prepare, build-macos]
    if: needs.prepare.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Compute SHA256 for universal dmg
        id: hash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ARM_DMG=$(ls artifacts/macos-aarch64-apple-darwin/*.dmg | head -n1)
          INTEL_DMG=$(ls artifacts/macos-x86_64-apple-darwin/*.dmg | head -n1)
          if [ -z "$ARM_DMG" ] || [ -z "$INTEL_DMG" ]; then
            echo "::error::Expected both aarch64 and x86_64 .dmg artifacts" >&2
            exit 1
          fi
          ARM_SHA=$(sha256sum "$ARM_DMG" | awk '{print $1}')
          INTEL_SHA=$(sha256sum "$INTEL_DMG" | awk '{print $1}')
          {
            echo "arm_sha=${ARM_SHA}"
            echo "intel_sha=${INTEL_SHA}"
            echo "arm_filename=$(basename "$ARM_DMG")"
            echo "intel_filename=$(basename "$INTEL_DMG")"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ufop/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Render cask
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARM_SHA: ${{ steps.hash.outputs.arm_sha }}
          INTEL_SHA: ${{ steps.hash.outputs.intel_sha }}
          ARM_FILE: ${{ steps.hash.outputs.arm_filename }}
          INTEL_FILE: ${{ steps.hash.outputs.intel_filename }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p homebrew-tap/Casks
          cat > homebrew-tap/Casks/unified-file-ops.rb <<RUBY
          cask "unified-file-ops" do
            version "${VERSION}"

            on_arm do
              sha256 "${ARM_SHA}"
              url "https://github.com/${REPO}/releases/download/v#{version}/${ARM_FILE}"
            end

            on_intel do
              sha256 "${INTEL_SHA}"
              url "https://github.com/${REPO}/releases/download/v#{version}/${INTEL_FILE}"
            end

            name "FileManager"
            desc "Cross-platform file manager, transfer, sync & governance"
            homepage "https://filemanager.clappe.com"

            depends_on macos: ">= :catalina"

            app "FileManager.app"

            zap trash: [
              "~/Library/Application Support/com.ufop.app",
              "~/Library/Caches/com.ufop.app",
              "~/Library/Preferences/com.ufop.app.plist",
              "~/Library/Saved Application State/com.ufop.app.savedState",
            ]
          end
          RUBY

      - name: Commit and push cask update
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="bump-unified-file-ops-${VERSION}"
          git checkout -b "$BRANCH"
          git add Casks/unified-file-ops.rb
          git commit -m "unified-file-ops ${VERSION}"
          git push --force --set-upstream origin "$BRANCH"

      - name: Open PR on tap repo
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        working-directory: homebrew-tap
        run: |
          gh pr create \
            --title "unified-file-ops ${VERSION}" \
            --body "Automated cask bump for FileManager ${VERSION}. Generated by the release workflow in \`ufop/unified-file-ops\`." \
            --head "bump-unified-file-ops-${VERSION}" \
            --base main || gh pr edit --title "unified-file-ops ${VERSION}" --body "Automated cask bump."

  # ---------------------------------------------------------------------------
  # winget manifest update (Windows)
  # ---------------------------------------------------------------------------
  # Uses winget-releaser to PR a new manifest to microsoft/winget-pkgs.
  # Requires a fork of microsoft/winget-pkgs under the org and a PAT with
  # `public_repo` scope passed as WINGET_RELEASE_TOKEN. Microsoft reviews PRs
  # in 24-72h after which `winget install UFOP.UnifiedFileOps` works globally.
  update-winget:
    needs: [prepare, build-windows]
    if: needs.prepare.outputs.channel == 'stable'
    runs-on: windows-latest
    steps:
      # TODO before going live: pin to an explicit upstream SHA (the rest of
      # this workflow pins actions by SHA - same hygiene applies here).
      - name: Submit to winget-pkgs
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: UFOP.UnifiedFileOps
          version: ${{ needs.prepare.outputs.version }}
          installers-regex: '\.(msi|exe)$'
          token: ${{ secrets.WINGET_RELEASE_TOKEN }}
